# caBundle is filled in by the controller at startup.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: waterwheel-injector
  labels: {{- include "waterwheel.labels" . | nindent 4 }}
webhooks:
- name: inject.waterwheel.riptides.io
  admissionReviewVersions: ["v1"]
  sideEffects: None
  # A pod that asked for the proxy and can't get it shouldn't start without it.
  failurePolicy: Fail
  reinvocationPolicy: Never
  timeoutSeconds: 5
  clientConfig:
    service:
      name: waterwheel-controller
      namespace: {{ .Release.Namespace }}
      path: /inject
  namespaceSelector:
    matchLabels:
      {{ .Values.injection.namespaceLabel }}: enabled
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
