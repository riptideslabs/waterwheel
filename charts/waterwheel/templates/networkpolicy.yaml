{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.webhookFrom }}
{{- fail "networkPolicy.webhookFrom must name where the API server calls the webhook from" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waterwheel-controller
  namespace: {{ .Release.Namespace }}
  labels: {{- include "waterwheel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller
  policyTypes: ["Ingress"]
  ingress:
  # Bindings API: the sidecars of injected pods.
  - from:
    - namespaceSelector:
        matchLabels:
          {{ .Values.injection.namespaceLabel }}: enabled
    ports:
    - {port: api}
  # Injection webhook: the API server.
  - from: {{- toYaml .Values.networkPolicy.webhookFrom | nindent 4 }}
    ports:
    - {port: webhook}
  # Probes.
  - ports:
    - {port: health}
  {{- if eq .Values.identity.source "waterwheel" }}
  # OIDC discovery and the JWKS are public.
  - ports:
    - {port: oidc}
  {{- end }}
{{- end }}
