---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: credentialsources.core.riptides.io
spec:
  group: core.riptides.io
  names:
    kind: CredentialSource
    listKind: CredentialSourceList
    plural: credentialsources
    shortNames:
    - credsrc
    singular: credentialsource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CredentialSource says how to exchange a workload's JWT-SVID for a provider's
          token. Field names follow the platform's CredentialSource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CredentialSourceSpec holds exactly one provider.
            properties:
              anthropic:
                description: |-
                  AnthropicWIFCredentialProvider exchanges the SVID at Anthropic's workload
                  identity federation endpoint (RFC 7523).
                properties:
                  federationRuleId:
                    pattern: ^fdrl_[a-zA-Z0-9]+$
                    type: string
                  idTokenAudience:
                    description: IDTokenAudience is the JWT-SVID's audience. Defaults
                      to https://api.anthropic.com.
                    items:
                      type: string
                    maxItems: 8
                    type: array
                  organizationId:
                    format: uuid
                    type: string
                  serviceAccountId:
                    pattern: ^svac_[a-zA-Z0-9]+$
                    type: string
                  workspaceId:
                    pattern: ^(wrkspc_[a-zA-Z0-9]+|default)$
                    type: string
                required:
                - federationRuleId
                - organizationId
                - serviceAccountId
                - workspaceId
                type: object
              azure:
                description: |-
                  EntraWIFCredentialProvider exchanges the SVID for a Microsoft Entra ID
                  access token. The SVID is the client assertion of an app registration or
                  managed identity that has a federated identity credential for it.
                properties:
                  audience:
                    description: Audience is the JWT-SVID's audience. Defaults to
                      api://AzureADTokenExchange.
                    items:
                      type: string
                    maxItems: 8
                    type: array
                  clientId:
                    format: uuid
                    type: string
                  scope:
                    description: Scope of the access token, e.g. https://cognitiveservices.azure.com/.default.
                    pattern: ^https://[a-z0-9.-]+/\.default$
                    type: string
                  tenantId:
                    format: uuid
                    type: string
                required:
                - clientId
                - scope
                - tenantId
                type: object
              gcp:
                description: |-
                  GCPWIFCredentialProvider exchanges the SVID at Google's Security Token
                  Service through a workload identity pool provider, and can then
                  impersonate a service account.
                properties:
                  audience:
                    description: |-
                      Audience is the JWT-SVID's audience. Defaults to https: followed by
                      oidcProviderId, which is the provider's default allowed audience.
                    items:
                      type: string
                    maxItems: 8
                    type: array
                  lifetime:
                    description: Lifetime of the impersonated service account's token.
                      Defaults to 1h.
                    maxLength: 16
                    type: string
                    x-kubernetes-validations:
                    - message: must be between 1m and 1h
                      rule: duration(self) >= duration('1m') && duration(self) <=
                        duration('1h')
                  oidcProviderId:
                    description: |-
                      OIDCProviderID is the provider's full resource name, which is also the
                      STS audience.
                    pattern: ^//iam\.googleapis\.com/projects/[0-9]{6,12}/locations/global/workloadIdentityPools/[a-z][a-z0-9-]{2,30}[a-z0-9]/providers/[a-z][a-z0-9-]{2,30}[a-z0-9]$
                    type: string
                  scopes:
                    description: Scopes default to cloud-platform and userinfo.email.
                    items:
                      pattern: ^https://www\.googleapis\.com/auth/[a-zA-Z0-9._-]+$
                      type: string
                    maxItems: 16
                    type: array
                  serviceAccount:
                    description: |-
                      ServiceAccount to impersonate. Without it, the token belongs to the
                      federated identity itself.
                    pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$
                    type: string
                required:
                - oidcProviderId
                type: object
                x-kubernetes-validations:
                - message: lifetime needs serviceAccount
                  rule: '!has(self.lifetime) || has(self.serviceAccount)'
              openai:
                description: |-
                  OpenAIWIFCredentialProvider exchanges the SVID at OpenAI's workload identity
                  federation endpoint (RFC 8693).
                properties:
                  clientId:
                    type: string
                  idTokenAudience:
                    description: IDTokenAudience is the JWT-SVID's audience. Defaults
                      to https://api.openai.com.
                    items:
                      type: string
                    maxItems: 8
                    type: array
                  identityProviderId:
                    minLength: 1
                    type: string
                  serviceAccountId:
                    minLength: 1
                    type: string
                required:
                - identityProviderId
                - serviceAccountId
                type: object
              rfc7523:
                description: RFC7523CredentialProvider presents the SVID as a JWT
                  bearer grant.
                properties:
                  additionalParams:
                    items:
                      properties:
                        key:
                          type: string
                        values:
                          items:
                            type: string
                          type: array
                      required:
                      - key
                      type: object
                    type: array
                  bodyFormat:
                    enum:
                    - BODY_FORMAT_FORM
                    - BODY_FORMAT_JSON
                    type: string
                  idTokenAudience:
                    description: IDTokenAudience is the JWT-SVID's audience. Defaults
                      to the token endpoint URL.
                    items:
                      type: string
                    maxItems: 8
                    type: array
                  scopes:
                    items:
                      type: string
                    type: array
                  tokenEndpointUrl:
                    pattern: ^https://
                    type: string
                required:
                - tokenEndpointUrl
                type: object
              rfc8693:
                description: |-
                  RFC8693CredentialProvider presents the SVID as the subject token of an
                  OAuth 2.0 token exchange.
                properties:
                  additionalFields:
                    additionalProperties:
                      type: string
                    type: object
                  audience:
                    description: Audience is the token exchange's audience parameter,
                      not the SVID's.
                    type: string
                  idTokenAudience:
                    description: IDTokenAudience is the JWT-SVID's audience. Defaults
                      to the token endpoint URL.
                    items:
                      type: string
                    maxItems: 8
                    type: array
                  requestedTokenType:
                    type: string
                  scopes:
                    items:
                      type: string
                    type: array
                  subjectTokenType:
                    enum:
                    - SUBJECT_TOKEN_TYPE_JWT
                    - SUBJECT_TOKEN_TYPE_ID_TOKEN
                    type: string
                  tokenEndpointUrl:
                    pattern: ^https://
                    type: string
                required:
                - tokenEndpointUrl
                type: object
            type: object
            x-kubernetes-validations:
            - message: set exactly one provider
              rule: '[has(self.anthropic), has(self.openai), has(self.gcp), has(self.azure),
                has(self.rfc7523), has(self.rfc8693)].filter(x, x).size() == 1'
          status:
            description: Status is shared by all Waterwheel kinds.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
