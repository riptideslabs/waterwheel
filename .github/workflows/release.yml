name: Release

# A v* tag (v0.1.0, or v0.1.0-rc.1 for a pre-release) publishes the images and
# the Helm chart to GHCR, signed with cosign, and makes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/riptideslabs

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  image:
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    strategy:
      matrix:
        include:
          - image: waterwheel-controller
            description: Serves each Waterwheel sidecar its bindings, and injects the sidecar
          - image: waterwheel-proxy
            description: Waterwheel's sidecar, which adds short-lived provider credentials to a pod's requests
          - image: waterwheel-agent
            description: Waterwheel's own SPIFFE agent (not deployed by default)
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Binaries
        run: |
          make dist BINS="$IMAGE"
          for f in dist/linux/*/"$IMAGE"; do
            v=$(go version -m "$f" | awk '$1 == "mod" { print $3 }')
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "::error::$f is version $v, not $GITHUB_REF_NAME"; exit 1; }
          done

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: type=ref,event=tag
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: dist
          file: build/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v4

      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/$IMAGE@$DIGEST"

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@v4

      - name: Chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          helm package charts/waterwheel --version "$version" --app-version "$GITHUB_REF_NAME" -d dist
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/waterwheel-$version.tgz" "oci://$REGISTRY/charts" 2>&1 | tee dist/push.log
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' dist/push.log | head -n 1)
          [ -n "$digest" ] || { echo "::error::no digest in helm push's output"; exit 1; }
          cosign sign --yes "$REGISTRY/charts/waterwheel@$digest"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          pre=()
          [[ "$version" != *-* ]] || pre=(--prerelease)
          cat >dist/notes.md <<EOF
          \`\`\`bash
          helm install waterwheel oci://$REGISTRY/charts/waterwheel --version $version \\
            --namespace waterwheel-system --create-namespace
          \`\`\`

          Images: \`$REGISTRY/waterwheel-{controller,proxy,agent}:$GITHUB_REF_NAME\`, for linux/amd64 and linux/arm64, signed with cosign (see [docs/releasing.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/releasing.md)).
          EOF
          gh release create "$GITHUB_REF_NAME" "dist/waterwheel-$version.tgz" \
            --verify-tag --generate-notes --notes-file dist/notes.md "${pre[@]}"
