name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generated code is committed
        run: make check-generate

      - name: vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Build
        run: make build

      - name: Test
        run: make test

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Helm chart
        run: make chart

      - name: Scripts
        run: make shellcheck
