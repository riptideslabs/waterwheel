name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # from release.yml

permissions:
  contents: read

jobs:
  # The KCD demo's five steps on kind, against the offline fake provider, with
  # each identity source.
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        identity: [serviceAccountToken, spire]
    name: kind (${{ matrix.identity }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0

      - name: make e2e
        env:
          LIMA_VM: "" # Docker and kind on the runner
          E2E_IDENTITY: ${{ matrix.identity }}
        run: make e2e

      # CA trust doesn't depend on the identity source, so once is enough.
      - name: make e2e-trust
        if: matrix.identity == 'serviceAccountToken'
        env:
          LIMA_VM: ""
        run: make e2e-trust

      - name: Cluster state
        if: failure()
        env:
          KUBECONFIG: .state/kubeconfig
        run: |
          kubectl get pods -A
          kubectl -n waterwheel-system logs deploy/waterwheel-controller --tail=100 || true
          kubectl -n support logs deploy/support-bot -c waterwheel-proxy --tail=100 || true
          kubectl -n support logs -l app=trust --all-containers --prefix --tail=50 || true
          kubectl -n waterwheel-e2e logs deploy/fake-provider --tail=100 || true
          kubectl get workloadidentities,credentialbindings -A -o wide || true
          kubectl get clusterspiffeids -o name || true
